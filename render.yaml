# Review the paid compute and disk before creating this single-service deployment.
services:
  - type: web
    name: researchmind-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g
    numInstances: 1
    healthCheckPath: /api/ready
    disk:
      name: researchmind-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "3000"
      - key: LLM_BACKEND
        value: gemini
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
