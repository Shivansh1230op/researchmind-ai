[project]
name = "researchmind-vercel-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.6,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4", "openai>=1.59.7,<3", "PyMuPDF>=1.25.2,<2",
  "python-docx>=1.1.2,<2", "numpy>=2.2,<3", "requests>=2.32.3,<3",
  "python-dotenv>=1.0.1,<2", "alembic>=1.14,<2", "vercel-blob==0.6.0", "vercel-queue==0.11.0",
]

[tool.vercel]
entrypoint = "index:app"
