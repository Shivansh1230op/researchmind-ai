name: Deployment container
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - requirements-server.txt
      - app/**
      - web/**
      - infra/**
      - .github/workflows/deployment.yml
jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: fullstack
          load: true
          tags: researchmind:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the complete application
        run: >-
          docker run -d --name researchmind-check -p 3200:3000
          -e PUBLIC_URL=http://localhost:3200 -e COOKIE_SECURE=false
          -e PRELOAD_EMBEDDINGS=false -e PROCESSING_WORKER_ENABLED=false
          -v researchmind-check-data:/data researchmind:check
      - name: Check public website and private API through the proxy
        run: |
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:3200/api/ready
          curl --fail --max-time 30 -o /dev/null http://localhost:3200/login
          docker restart researchmind-check
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 --max-time 5 http://localhost:3200/api/ready
      - name: Container logs
        if: always()
        run: docker logs researchmind-check || true
      - name: Stop test container
        if: always()
        run: docker rm -f researchmind-check || true
