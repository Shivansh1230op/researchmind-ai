services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DEBUG: "false"
      AUTH_REQUIRED: "true"
      DATABASE_URL: sqlite:///data/documind.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    build:
      context: ./web
      args:
        API_PROXY_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  model-cache:
